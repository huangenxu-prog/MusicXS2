name: MusicX iOS build

on:
  push:
    branches:
      - ios/initial-scaffold
      - home/final-design-asset-pass
      - feature/official-collections-dual-source
      - test/build-486-complete-source
      - test/ui-build-486-exact
      - feature/light-skin-repeat-one-20261123
      - feature/light-design-fidelity-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicx-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test library playback queue
        run: |
          swiftc MusicX/Features/Home/LibraryQueue.swift \
            MusicX/MusicSources/MusicSourceModels.swift \
            tests/main.swift -o /tmp/test-library-queue
          /tmp/test-library-queue

      - name: Test LX source restore and crash recovery
        run: |
          swiftc -parse-as-library \
            MusicX/ResourceEngine/LXCompatibility/LXSourceLibrary.swift \
            tests/source-archive.swift \
            -o /tmp/test-source-archive
          /tmp/test-source-archive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install search category photo assets
        run: |
          ASSET_CATALOG="$(find . -type d -name Assets.xcassets -print -quit)"
          test -n "$ASSET_CATALOG"
          unzip -oq "$ASSET_CATALOG/MusicX-SearchCategory-Assets.zip" -d "$ASSET_CATALOG"
          rm "$ASSET_CATALOG/MusicX-SearchCategory-Assets.zip"
          for n in 01 02 03 04 05 06; do
            test -s "$ASSET_CATALOG/SearchCategory${n}.imageset/SearchCategory${n}.jpg"
            plutil -lint "$ASSET_CATALOG/SearchCategory${n}.imageset/Contents.json" || python3 -m json.tool "$ASSET_CATALOG/SearchCategory${n}.imageset/Contents.json" >/dev/null
          done

      - name: Render app icon asset
        run: swift scripts/render-app-icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Smoke test LX JavaScriptCore bridge on macOS
        run: |
          swiftc -framework JavaScriptCore \
            MusicX/ResourceEngine/LXCompatibility/LXSourceScriptHost.swift \
            scripts/test-lx-bridge.swift \
            -o /tmp/test-lx-bridge
          /tmp/test-lx-bridge

      - name: Archive for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project MusicX.xcodeproj \
            -scheme MusicX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MusicX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived background audio configuration
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          bundle = Path('build/MusicX.xcarchive/Products/Applications/MusicX.app/BundledLXSources.json')
          scripts = json.loads(bundle.read_text())
          assert len(scripts) == 4, 'Built-in LX sources missing from IPA'
          assert {s['id'] for s in scripts} == {'builtin-xinghai', 'builtin-hello-world', 'builtin-fish', 'builtin-hyw'}, 'Wrong LX source identities'
          assert all(s['contents'].strip() for s in scripts)
          print('Verified four bundled LX scripts in archived app')
          PYCODE
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist | grep -qx audio
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSExceptionDomains:yinyue.haitangw.net:NSExceptionAllowsInsecureHTTPLoads' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist | grep -qx true

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/MusicX.xcarchive/Products/Applications/MusicX.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry MusicX-unsigned.ipa Payload
          test -s MusicX-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-unsigned-IPA
          path: build/ipa/MusicX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
