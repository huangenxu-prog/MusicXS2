name: MusicX
options:
  bundleIdPrefix: com.huangenxu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MusicX:
    type: application
    platform: iOS
    sources:
      - path: MusicX
    info:
      path: MusicX/Info.plist
      properties:
        CFBundleShortVersionString: "2.341"
        CFBundleVersion: "341"
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # LX compatibility test only; revert before production
          NSExceptionDomains:
            yinyue.haitangw.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.musicx
        MARKETING_VERSION: "2.341"
        CURRENT_PROJECT_VERSION: "341"
        INFOPLIST_KEY_CFBundleShortVersionString: "2.341"
        INFOPLIST_KEY_CFBundleVersion: "341"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
  QueueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QueueUITests]
    dependencies:
      - target: MusicX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.musicx.queueuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MusicX
schemes:
  MusicX:
    build:
      targets:
        MusicX: all
    test:
      targets: [QueueUITests]
